name: Deploy prod site

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Sync webapp/ to PythonAnywhere
        run: |
          rsync -az --delete \
            --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude 'logs/' --exclude 'output/' --exclude 'Players/' \
            --exclude '_persistent_storage.yaml' --exclude 'host.yaml' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            webapp/ "${{ secrets.PA_USERNAME }}@ssh.pythonanywhere.com:/home/${{ secrets.PA_USERNAME }}/mysite/"

      - name: Install/update Python dependencies
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PA_USERNAME }}@ssh.pythonanywhere.com" \
            "find /home/${{ secrets.PA_USERNAME }}/mysite -name requirements.txt -print0 | xargs -0 -n1 /home/${{ secrets.PA_USERNAME }}/.virtualenvs/kh1appvenv/bin/pip install -r"

      - name: Sync prod Discord bot
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519" \
            discord_bot.py discord_bot_settings.py \
            "${{ secrets.PA_USERNAME }}@ssh.pythonanywhere.com:/home/${{ secrets.PA_USERNAME }}/"

      - name: Reload prod web app
        run: |
          curl -sf -o /dev/null -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_USERNAME }}.pythonanywhere.com/reload/" \
            || echo "::warning::Reload API call returned an error, but PythonAnywhere's reload endpoint is known to time out (~30s) on slow reloads while still completing the reload in the background. Verifying the site is actually back up next."

      - name: Verify prod web app is back up
        run: |
          for i in $(seq 1 18); do
            if curl -sf -o /dev/null "https://${{ secrets.PA_USERNAME }}.pythonanywhere.com/kh1.apworld"; then
              echo "Site responded successfully."
              exit 0
            fi
            echo "Site not responding yet (attempt $i/18), retrying in 10s..."
            sleep 10
          done
          echo "::error::Prod web app did not come back up after reload."
          exit 1

      - name: Restart prod Discord bot task
        run: |
          curl -sf -o /dev/null -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/always_on/${{ secrets.PA_BOT_TASK_ID }}/restart/"
